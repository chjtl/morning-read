name: Build morning page

on:
  schedule:
    # Rebuild in the hours before a 6am Eastern read. Three runs so the page
    # is fresh whether or not daylight saving is in effect, and so one
    # transient feed outage doesn't leave you with a stale page.
    - cron: "0 9,10,11 * * *"
  workflow_dispatch:        # lets you rebuild on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build page
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
